---
version: 2

project_name: fireactions

env:
# Container images are published to the GHCR namespace of the repository that is
# being released, so a fork publishes under its own namespace without having to
# patch this file. GITHUB_REPOSITORY is set automatically by GitHub Actions;
# local runs fall back to the upstream repository and can override it by
# exporting GITHUB_REPOSITORY themselves.
- IMAGE_REPO=ghcr.io/{{ tolower (envOrDefault "GITHUB_REPOSITORY" "hostinger/fireactions") }}

builds:
- id: fireactions
  main: ./cmd/fireactions
  env:
  - CGO_ENABLED=0
  binary: fireactions
  goos:
  - linux
  goarch:
  - amd64
  - arm64
  ldflags:
  - -X github.com/hostinger/fireactions.Version={{ .Version }}
  - -X github.com/hostinger/fireactions.Commit={{ .ShortCommit }}
  - -X github.com/hostinger/fireactions.Date={{ .CommitDate }}

archives:
- id: fireactions
  ids:
  - fireactions
  name_template: fireactions-v{{ .Version }}-{{ .Os }}-{{ .Arch }}
  formats:
  - tar.gz

dockers:
- id: fireactions-amd64
  use: buildx
  dockerfile: Dockerfile
  image_templates:
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-amd64"
  extra_files:
    - "./"
  build_flag_templates:
  - "--pull"
  - "--platform=linux/amd64"
  goarch: amd64
- id: fireactions-arm64
  use: buildx
  dockerfile: Dockerfile
  image_templates:
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-arm64"
  extra_files:
    - "./"
  build_flag_templates:
  - "--pull"
  - "--platform=linux/arm64"
  goarch: arm64

docker_manifests:
- name_template: "{{ .Env.IMAGE_REPO }}:{{ .Version }}"
  image_templates:
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-amd64"
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-arm64"
- name_template: "{{ .Env.IMAGE_REPO }}:latest"
  image_templates:
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-amd64"
  - "{{ .Env.IMAGE_REPO }}:{{ .Version }}-arm64"

release:
  # Tags carrying a semver pre-release suffix (for example v2.0.5-personal.1)
  # are published as GitHub pre-releases so they don't displace the latest
  # stable release.
  prerelease: auto

# Changelog is managed by release-please
changelog:
  disable: true

checksum:
  name_template: fireactions-v{{ .Version }}-checksums.txt
